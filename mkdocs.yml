site_name: Prompt2Production
site_description: Learn and skill up with GitHub Copilot - from Ask mode to multi-agent orchestration
site_author: Saravanan Rajaraman
site_url: https://SaravananRajaraman.github.io/Prompt2Production/
repo_url: https://github.com/SaravananRajaraman/Prompt2Production
repo_name: Prompt2Production
docs_dir: docs
nav:
  - Home: index.md
  - Getting Started: Getting_Started_Primer.md
  - Learning Paths: Learning_Paths.md
  - Session 1 - Foundation: Session1_Building_The_Foundation.md
  - Session 2 - Advanced: Session2_Advanced_Agent_Capabilities.md
  - Tutorials: Tutorials_Hands_On.md
  - FAQ: FAQ_For_Beginners.md
  - All Links: All_Links.md
  - Examples: examples/README.md
  - Automation: Automation.md

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - search.highlight
    - search.share
    - content.code.copy
    - toc.follow
  language: en

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      use_pygments: true
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true
      title: On this page
      toc_depth: 3

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SaravananRajaraman/Prompt2Production
      name: GitHub

copyright: Copyright &copy; 2025 - 2026 Saravanan Rajaraman
