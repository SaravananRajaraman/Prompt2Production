# Jekyll Site Configuration
# GitHub Pages with Mermaid Support

# Site Settings
title: Prompt2Production
tagline: "Low Code or No Code · Prompt to Production"
description: >
  Comprehensive guides and hands-on tutorials for mastering GitHub Copilot—
  from your first prompt to building production workflows with multi-agent orchestration.

author:
  name: Prompt2Production Contributors
  url: https://github.com

# Build Settings
remote_theme: just-the-docs/just-the-docs@v0.12.0

# Just the Docs Configuration
color_scheme: light
search_enabled: true
heading_anchors: true
mermaid:
  version: "10"

# Auxiliary Links
aux_links:
  "Repository": "https://github.com/SaravananRajaraman/Prompt2Production"

# Markdown Settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# Plugins
plugins:
  - jekyll-github-metadata

# Permalink Structure
permalink: /:title/

# Collections
collections_dir: collections

# Output
safe: false
lsi: false
incremental: false
