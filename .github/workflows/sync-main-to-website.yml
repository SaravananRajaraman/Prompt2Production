name: Sync Main to Website Branch

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'README.md'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch all branches
        run: git fetch origin

      - name: Checkout website branch
        run: |
          git checkout website || git checkout -b website origin/website

      - name: Sync documentation files from main
        run: |
          # Sync all markdown files from main's docs/ to website's root
          git checkout origin/main -- docs/
          
          # Move all .md files from docs/ to root, excluding examples/
          find docs/ -maxdepth 1 -name "*.md" -type f | while read file; do
            filename=$(basename "$file")
            mv "$file" "$filename"
          done
          
          # Sync README.md from main
          git checkout origin/main -- README.md
          
          # Remove empty docs directory if it only contains examples/
          if [ -d "docs" ] && [ -z "$(find docs/ -maxdepth 1 -type f)" ]; then
            echo "docs/ directory is empty (only contains examples), keeping for reference"
          fi

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --cached --quiet && git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git add -A
          git commit -m "chore: sync documentation from main branch" || true
          git push origin website

      - name: Summary
        run: |
          echo "✅ Sync completed"
          echo "Documentation synchronized from main to website branch"
          git log website --oneline -1
