# Jekyll Site Configuration
# GitHub Pages with Mermaid Support

# Site Settings
title: Prompt2Production
tagline: "Low Code or No Code · Prompt to Production"
description: >
  Comprehensive guides and hands-on tutorials for mastering GitHub Copilot—
  from your first prompt to building production workflows with multi-agent orchestration.

author:
  name: Prompt2Production Contributors
  url: https://github.com

# Build Settings
remote_theme: cotes2020/jekyll-theme-chirpy@latest

# Chirpy Configuration
mermaid:
  version: "10"

theme_mode: auto  # auto, light, or dark
search_enabled: true

# Auxiliary Links & Social Media
aux_links:
  "GitHub Repo": "https://github.com/SaravananRajaraman/Prompt2Production"

social:
  name: Prompt2Production
  links:
    - https://github.com/SaravananRajaraman/Prompt2Production

# Markdown Settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Plugins
plugins:
  - jekyll-github-metadata
  - jekyll-paginate

# Pagination
paginate: 10
paginate_path: /page:num/

# Permalink Structure
permalink: /:title/

# URL
url: "https://saravananrajaraman.github.io"
baseurl: "/Prompt2Production"

# Output
safe: false 
lsi: false
incremental: false
